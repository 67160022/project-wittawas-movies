---
openapi: 3.0.3
info:
  title: Movies API
  version: 3.0.0
  description: |
    Movies API สำหรับจัดการหนัง ผู้กำกับ และรีวิว พร้อมค้นหาหนังผ่าน iTunes Search API

    **สถาปัตยกรรม (Phase 3):**
    - **Movies API / Gateway** (`:3000`) — จัดการหนังและผู้กำกับ, เสิร์ฟ Frontend, และส่งต่อคำขอรีวิวไปยัง Review Service
    - **Review Service** (`:3001`) — Microservice ที่ดูแลข้อมูลรีวิว (endpoint ภายใน tag `Review Service (internal)`)

    Request หนังใช้ `releaseYear`; response จากฐานข้อมูลใช้ `release_year` และ `movie_code`
    ส่วน POST หนังตอบ `releaseYear` และ `movieCode`

    [← กลับไปหน้าเว็บ Movies Hub](/)
servers:
  - url: http://localhost:3000
    description: Movies API (Gateway)
tags:
  - name: Health
  - name: Movies
  - name: Directors
  - name: Reviews
    description: Gateway ส่งต่อไปยัง Review Service
  - name: External
    description: ค้นหาข้อมูลหนังจากบริการภายนอก
  - name: Review Service (internal)
    description: Microservice ที่ port 3001 — Frontend ไม่เรียกตรง แต่เรียกผ่าน Gateway
paths:
  "/api/v1/health":
    get:
      tags: [Health]
      summary: ตรวจสอบสถานะ Movies API และ Review Service
      responses:
        "200":
          description: Movies API ทำงาน; review-service เป็น ok หรือ unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
              example:
                message: Movies API พร้อมใช้งาน
                services:
                  movies-api: ok
                  review-service: ok

  "/api/v1/directors":
    get:
      tags: [Directors]
      summary: ดึงรายชื่อผู้กำกับทั้งหมด (เรียงตามชื่อ)
      responses:
        "200":
          description: รายชื่อผู้กำกับ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DirectorsResponse"
        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      tags: [Directors]
      summary: เพิ่มผู้กำกับใหม่ (ชื่อห้ามซ้ำกับที่มีอยู่ โดยไม่สนตัวพิมพ์เล็ก/ใหญ่)
      description: |
        หน้าเว็บเรียก endpoint นี้เมื่อผู้ใช้เลือก "+ เพิ่มผู้กำกับใหม่..." ใน dropdown ผู้กำกับ
        แล้วนำ director_id ที่ได้ไปใช้ต่อใน POST /api/v1/movies หรือ PUT /api/v1/movies/{id}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DirectorInput"
            example:
              name: Denis Villeneuve
              nationality: Canadian
      responses:
        "201":
          description: เพิ่มผู้กำกับสำเร็จ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DirectorResponse"
              example:
                message: เพิ่มข้อมูลผู้กำกับสำเร็จ
                data:
                  director_id: 6
                  name: Denis Villeneuve
                  nationality: Canadian
        "400":
          description: "ข้อมูลไม่ถูกต้อง: VALIDATION_ERROR หรือ body ไม่ใช่ JSON ที่ถูกต้อง: INVALID_JSON"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: ชื่อผู้กำกับต้องเป็นข้อความ 1-150 ตัวอักษร
        "409":
          description: "มีผู้กำกับชื่อนี้อยู่แล้ว: CONFLICT_ERROR"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error:
                  code: CONFLICT_ERROR
                  message: ผู้กำกับนี้มีอยู่แล้วในระบบ
        "500":
          "$ref": "#/components/responses/InternalError"

  "/api/v1/movies":
    get:
      tags: [Movies]
      summary: ดึงข้อมูลหนังทั้งหมด
      responses:
        "200":
          description: รายการหนังทั้งหมด
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MoviesResponse"
        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      tags: [Movies]
      summary: เพิ่มหนังใหม่ (ระบบ gen movieCode จาก 4 ตัวอักษรแรกของชื่อ + ปี)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MovieInput"
            example:
              title: Interstellar
              director_id: 1
              releaseYear: 2014
      responses:
        "201":
          description: เพิ่มหนังสำเร็จ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedMovieResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          description: "ไม่พบผู้กำกับ: DIRECTOR_NOT_FOUND"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"

  "/api/v1/movies/{id}":
    parameters:
      - "$ref": "#/components/parameters/MovieId"
    get:
      tags: [Movies]
      summary: ดึงข้อมูลหนังตาม ID
      responses:
        "200":
          description: ข้อมูลหนัง
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MovieResponse"
        "404":
          "$ref": "#/components/responses/MovieNotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
    put:
      tags: [Movies]
      summary: แก้ไขข้อมูลหนังทั้งหมด (ต้องส่งครบทุกฟิลด์)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MovieInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MovieResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          description: "ไม่พบหนัง: NOT_FOUND หรือไม่พบผู้กำกับ: DIRECTOR_NOT_FOUND"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
    patch:
      tags: [Movies]
      summary: แก้ไขข้อมูลหนังบางส่วน (ฟิลด์ที่ไม่ส่งหรือเป็น null ใช้ค่าเดิม)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MoviePatch"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MovieResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          description: "ไม่พบหนัง: NOT_FOUND หรือไม่พบผู้กำกับ: DIRECTOR_NOT_FOUND"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
    delete:
      tags: [Movies]
      summary: ลบหนัง (รีวิวของหนังถูกลบตามด้วย ON DELETE CASCADE)
      responses:
        "200":
          description: ลบสำเร็จ คืนข้อมูลหนังที่ถูกลบ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MovieResponse"
              example:
                message: ลบข้อมูลหนังสำเร็จ
                data:
                  movie_id: 1
                  title: Inception
                  director_id: 1
                  release_year: 2010
                  movie_code: INCP2010
        "404":
          "$ref": "#/components/responses/MovieNotFound"
        "500":
          "$ref": "#/components/responses/InternalError"

  "/api/v1/movies/{id}/reviews":
    parameters:
      - "$ref": "#/components/parameters/MovieId"
    get:
      tags: [Reviews]
      summary: ดึงรีวิวทั้งหมดของหนัง พร้อมจำนวนและคะแนนเฉลี่ย
      description: Gateway ตรวจว่ามีหนังจริงก่อน แล้วส่งต่อไปยัง `GET /reviews?movie_id=` ของ Review Service
      responses:
        "200":
          description: รายการรีวิว (ใหม่สุดก่อน)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewsResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/ReviewMovieNotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ReviewServiceUnavailable"
    post:
      tags: [Reviews]
      summary: เพิ่มรีวิวให้หนัง
      description: Gateway ตรวจว่ามีหนังจริงก่อน แล้วส่งต่อไปยัง `POST /reviews` ของ Review Service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReviewInput"
            example:
              rating: 5
              comment: สนุกมาก
      responses:
        "201":
          description: เพิ่มรีวิวสำเร็จ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/ReviewMovieNotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ReviewServiceUnavailable"

  "/api/v1/reviews/{reviewId}":
    parameters:
      - "$ref": "#/components/parameters/ReviewId"
    delete:
      tags: [Reviews]
      summary: ลบรีวิวตาม ID
      description: Gateway ส่งต่อไปยัง `DELETE /reviews/{id}` ของ Review Service
      responses:
        "200":
          description: ลบสำเร็จ คืนข้อมูลรีวิวที่ถูกลบ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewDeletedResponse"
        "404":
          "$ref": "#/components/responses/ReviewNotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ReviewServiceUnavailable"

  "/api/v1/external/movies":
    get:
      tags: [External]
      operationId: searchExternalMovies
      summary: ค้นหาหนังจาก iTunes Search API
      description:
        เรียกบริการภายนอกสูงสุด 3 ครั้ง (ครั้งแรกและ retry 2 ครั้ง) เมื่อ
        network error, timeout หรือ HTTP 5xx. Timeout 5 วินาทีต่อครั้ง; delay 0.5
        และ 1 วินาที. ไม่ retry HTTP 4xx. คืนเฉพาะผลประเภท feature-movie สูงสุด 5 เรื่อง.
        กรณีล้มเหลวตอบ 503 พร้อมข้อความ fallback และรายการว่าง.
      parameters:
        - name: term
          in: query
          required: true
          description: ชื่อหนังหรือคำค้น ต้องไม่ว่างหรือมีเพียงช่องว่าง
          schema:
            type: string
            minLength: 1
          example: batman
      responses:
        "200":
          description: บริการภายนอกตอบสำเร็จ (ไม่พบหนังจะได้ data ว่าง)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExternalMoviesSuccess"
        "400":
          description: ไม่ระบุคำค้น
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: กรุณาระบุชื่อหนังใน query parameter term
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          description: บริการภายนอกล้มเหลวและระบบตอบ fallback
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExternalMoviesFallback"

  # ---------- Review Service (Microservice, port 3001) ----------
  "/health":
    servers:
      - url: http://localhost:3001
        description: Review Service
    get:
      tags: [Review Service (internal)]
      summary: ตรวจสอบสถานะ Review Service
      responses:
        "200":
          description: Review Service ทำงาน
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: review-service
                  status:
                    type: string
                    example: ok
  "/reviews":
    servers:
      - url: http://localhost:3001
        description: Review Service
    get:
      tags: [Review Service (internal)]
      summary: ดึงรีวิวของหนังตาม movie_id
      parameters:
        - name: movie_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: รายการรีวิวพร้อมสรุปคะแนน
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewsResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      tags: [Review Service (internal)]
      summary: เพิ่มรีวิว
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - "$ref": "#/components/schemas/ReviewInput"
                - type: object
                  required: [movie_id]
                  properties:
                    movie_id:
                      type: integer
                      minimum: 1
      responses:
        "201":
          description: เพิ่มรีวิวสำเร็จ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/ReviewMovieNotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/reviews/{id}":
    servers:
      - url: http://localhost:3001
        description: Review Service
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: "1"
    delete:
      tags: [Review Service (internal)]
      summary: ลบรีวิวตาม ID
      responses:
        "200":
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewDeletedResponse"
        "404":
          "$ref": "#/components/responses/ReviewNotFound"
        "500":
          "$ref": "#/components/responses/InternalError"

components:
  parameters:
    MovieId:
      name: id
      in: path
      required: true
      description: ID หนัง
      schema:
        type: string
      example: "1"
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: ID รีวิว
      schema:
        type: string
      example: "1"

  responses:
    BadRequest:
      description: "ข้อมูลไม่ถูกต้อง: VALIDATION_ERROR หรือ body ไม่ใช่ JSON ที่ถูกต้อง: INVALID_JSON"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: กรุณากรอกข้อมูลหนังให้ครบถ้วน
    MovieNotFound:
      description: "ไม่พบหนัง: NOT_FOUND"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: ไม่พบข้อมูลหนัง
    ReviewMovieNotFound:
      description: "ไม่พบหนังที่จะรีวิว: MOVIE_NOT_FOUND"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: MOVIE_NOT_FOUND
              message: ไม่พบข้อมูลหนัง
    ReviewNotFound:
      description: "ไม่พบรีวิว: REVIEW_NOT_FOUND"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: REVIEW_NOT_FOUND
              message: ไม่พบข้อมูลรีวิว
    Conflict:
      description: "ชื่อหนังหรือ movie_code ซ้ำ: CONFLICT_ERROR"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: CONFLICT_ERROR
              message: หนังนี้มีอยู่แล้วในระบบ
    ReviewServiceUnavailable:
      description: "Review Service ล่มหรือไม่ตอบภายใน 3 วินาที: REVIEW_SERVICE_UNAVAILABLE"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: REVIEW_SERVICE_UNAVAILABLE
              message: บริการรีวิวไม่พร้อมใช้งาน กรุณาลองใหม่ภายหลัง
    InternalError:
      description: "เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์: INTERNAL_SERVER_ERROR"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์

  schemas:
    HealthResponse:
      type: object
      properties:
        message:
          type: string
        services:
          type: object
          properties:
            movies-api:
              type: string
              enum: [ok]
            review-service:
              type: string
              enum: [ok, unavailable]
    Director:
      type: object
      properties:
        director_id:
          type: integer
        name:
          type: string
        nationality:
          type: string
          nullable: true
    DirectorsResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Director"
    DirectorInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: ตัดช่องว่างหัวท้ายก่อนบันทึก; ห้ามซ้ำกับผู้กำกับที่มีอยู่ (ไม่สนตัวพิมพ์เล็ก/ใหญ่)
        nationality:
          type: string
          maxLength: 100
          nullable: true
          description: ไม่บังคับ; ส่งค่าว่างหรือ null จะบันทึกเป็น null
    DirectorResponse:
      type: object
      properties:
        message:
          type: string
        data:
          "$ref": "#/components/schemas/Director"
    Movie:
      type: object
      properties:
        movie_id:
          type: integer
        title:
          type: string
        director_id:
          type: integer
        release_year:
          type: integer
        movie_code:
          type: string
        created_at:
          type: string
          format: date-time
    MovieInput:
      type: object
      required: [title, director_id, releaseYear]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: ตัดช่องว่างหัวท้ายก่อนบันทึก
        director_id:
          type: integer
          minimum: 1
          description: ID ผู้กำกับที่มีอยู่ในฐานข้อมูล
        releaseYear:
          type: integer
          minimum: 1888
          description: ไม่เกินปีปัจจุบัน + 5
    MoviePatch:
      type: object
      description: ส่งเฉพาะฟิลด์ที่ต้องการแก้ไข; ฟิลด์ที่ส่งมาต้องผ่านเงื่อนไขเดียวกับ MovieInput
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
        director_id:
          type: integer
          minimum: 1
          nullable: true
        releaseYear:
          type: integer
          minimum: 1888
          nullable: true
    CreatedMovie:
      type: object
      properties:
        movie_id:
          type: integer
        title:
          type: string
        director_id:
          type: integer
        releaseYear:
          type: integer
        movieCode:
          type: string
    MovieResponse:
      type: object
      properties:
        message:
          type: string
        data:
          "$ref": "#/components/schemas/Movie"
    CreatedMovieResponse:
      type: object
      properties:
        message:
          type: string
        data:
          "$ref": "#/components/schemas/CreatedMovie"
    MoviesResponse:
      type: object
      properties:
        message:
          type: string
        data:
